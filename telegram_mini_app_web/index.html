<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222222);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .page { display: none; }
        .active { display: block; }

        /* Menú de Navegación */
        nav { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 1px solid var(--hint); padding-bottom: 10px; }
        nav span { cursor: pointer; font-weight: bold; color: var(--hint); }
        nav span.active-tab { color: var(--btn); border-bottom: 2px solid var(--btn); }

        /* Formulario */
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.9em; color: var(--hint); margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--hint); border-radius: 8px; box-sizing: border-box; background: var(--bg); color: var(--text); }

        .user-card { background: rgba(0,0,0,0.05); padding: 15px; border-radius: 12px; margin-top: 20px; }
    </style>
</head>
<body>

<nav>
    <span id="tab-home" class="active-tab" onclick="showPage('home')">Inicio</span>
    <span id="tab-form" onclick="showPage('form')">Reportar Incidencia</span>
</nav>

<div id="home" class="page active">
    <h2>Panel de Usuario</h2>
    <div id="user-info" class="user-card">Cargando datos...</div>
    <p>Selecciona la pestaña superior para enviar un reporte.</p>
</div>

<div id="form" class="page">
    <h3>Nuevo Reporte</h3>
    <div class="form-group">
        <label>Tipo de problema</label>
        <select id="issue-type">
            <option value="tecnico">Fallo Técnico</option>
            <option value="pago">Problema de Pago</option>
            <option value="otro">Otro</option>
        </select>
    </div>
    <div class="form-group">
        <label>Descripción</label>
        <textarea id="description" rows="4" placeholder="Describe qué sucede..."></textarea>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Mostrar datos del usuario
    const user = tg.initDataUnsafe?.user;
    if (user) {
        document.getElementById('user-info').innerHTML = `
                <strong>Usuario:</strong> ${user.first_name} ${user.last_name || ''}<br>
                <strong>ID:</strong> <code>${user.id}</code>
            `;
    }

    // Navegación entre pestañas
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav span').forEach(s => s.classList.remove('active-tab'));

        document.getElementById(pageId).classList.add('active');
        document.getElementById('tab-' + pageId).classList.add('active-tab');

        // Mostrar el botón nativo de Telegram solo en el formulario
        if (pageId === 'form') {
            tg.MainButton.setText("ENVIAR REPORTE");
            tg.MainButton.show();
        } else {
            tg.MainButton.hide();
        }
    }

    // Manejo del botón principal de Telegram
    tg.MainButton.onClick(() => {
        const data = {
            tipo: document.getElementById('issue-type').value,
            desc: document.getElementById('description').value,
            user_id: user?.id
        };

        if (data.desc.length < 5) {
            tg.showAlert("Por favor, describe mejor el problema.");
            return;
        }

        tg.sendData(JSON.stringify(data)); // Envía JSON al bot
    });
</script>
</body>
</html>
